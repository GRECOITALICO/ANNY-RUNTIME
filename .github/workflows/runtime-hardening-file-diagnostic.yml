name: runtime hardening file diagnostic

on:
  push:
    branches:
      - codex/anny-runtime-hardening-20260922-001
  pull_request:
    paths:
      - "runtime/**"
      - "cli/**"
      - "tests/test_runtime_hardening_20260922.py"
      - "tests/test_worker_020.py"
      - "tests/test_workspace_execution_018.py"
      - "tests/test_deterministic_local_execution.py"
      - "tests/test_sync_service.py"
      - "tests/test_registry_019.py"
      - "tests/test_mcp_gateway_003.py"
      - ".github/workflows/runtime-hardening-file-diagnostic.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML cryptography psutil azure-identity httpx mcp websocket-client python-dateutil
      - name: Compile hardened runtime modules
        run: |
          python -m py_compile runtime/execution/registry.py runtime/execution/worker.py runtime/execution/qwen_executor.py runtime/execution/deterministic_executor.py runtime/mcp/gateway.py runtime/mcp/tools.py runtime/api/bridge.py runtime/core/engine.py cli/main.py

      - name: worker_020
        continue-on-error: true
        run: pytest -q tests/test_worker_020.py

      - name: registry_019
        continue-on-error: true
        run: pytest -q tests/test_registry_019.py

      - name: runtime_hardening_20260922
        continue-on-error: true
        run: pytest -q tests/test_runtime_hardening_20260922.py

      - name: workspace_execution_018
        continue-on-error: true
        run: pytest -q tests/test_workspace_execution_018.py

      - name: deterministic_local_execution
        continue-on-error: true
        run: pytest -q tests/test_deterministic_local_execution.py

      - name: sync_service
        continue-on-error: true
        run: pytest -q tests/test_sync_service.py

      - name: mcp_gateway_003
        continue-on-error: true
        run: pytest -q tests/test_mcp_gateway_003.py
