name: model registry recovery regression

on:
  pull_request:
    paths:
      - 'runtime/execution/registry.py'
      - 'tests/test_022_model_registry.py'
      - '.github/workflows/model-registry-recovery-regression.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'runtime/execution/registry.py'
      - 'tests/test_022_model_registry.py'
      - '.github/workflows/model-registry-recovery-regression.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML cryptography psutil azure-identity httpx mcp websocket-client python-dateutil
      - name: Compile touched modules
        run: |
          python -m py_compile runtime/execution/registry.py tests/test_022_model_registry.py
      - name: Run model registry regression
        run: pytest -q tests/test_022_model_registry.py
