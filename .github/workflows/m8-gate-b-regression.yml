name: M8 Gate B integration regression

on:
  pull_request:
    paths:
      - "runtime/admin/server.py"
      - "runtime/bootstrap/planes.py"
      - "runtime/bootstrap/report.py"
      - "runtime/conrrad/**"
      - "runtime/core/config.py"
      - "runtime/core/engine.py"
      - "runtime/fabric/github_adapter.py"
      - "runtime/fabric/models.py"
      - "runtime/fabric/trust_verifier.py"
      - "runtime/security/execution_context.py"
      - "runtime/security/execution_context_client.py"
      - "runtime/security/installation_auth.py"
      - "runtime/security/m8_evidence.py"
      - "tests/test_m8_gate_b.py"
      - ".github/workflows/m8-gate-b-regression.yml"

jobs:
  m8-gate-b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML cryptography psutil azure-identity httpx mcp websocket-client python-dateutil
      - name: Compile Gate B modules
        run: |
          python -m py_compile             runtime/admin/server.py             runtime/bootstrap/planes.py             runtime/bootstrap/report.py             runtime/conrrad/preflight.py             runtime/core/config.py             runtime/core/engine.py             runtime/fabric/github_adapter.py             runtime/fabric/models.py             runtime/fabric/trust_verifier.py             runtime/security/execution_context.py             runtime/security/execution_context_client.py             runtime/security/installation_auth.py             runtime/security/m8_evidence.py             tests/test_m8_gate_b.py
      - name: Run Gate B tests
        run: |
          pytest -q tests/test_m8_gate_b.py
          pytest -q tests/test_bootstrap_gates.py tests/test_bootstrap_admin_port.py
