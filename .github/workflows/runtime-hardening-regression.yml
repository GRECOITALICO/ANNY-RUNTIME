name: runtime hardening regression

on:
  pull_request:
    paths:
      - "runtime/**"
      - "cli/**"
      - "scripts/**"
      - "tests/test_runtime_hardening_20260922.py"
      - "tests/test_worker_020.py"
      - "tests/test_workspace_execution_018.py"
      - "tests/test_deterministic_local_execution.py"
      - "tests/test_sync_service.py"
      - "tests/test_registry_019.py"
      - "tests/test_mcp_gateway_003.py"
      - ".github/workflows/runtime-hardening-regression.yml"

jobs:
  hardening:
    strategy:
      fail-fast: false
      matrix:
        test_file:\n          - tests/test_worker_020.py::test_01_create_worker\n          - tests/test_worker_020.py::test_02_start_worker\n          - tests/test_worker_020.py::test_03_running_worker\n          - tests/test_worker_020.py::test_04_success\n          - tests/test_worker_020.py::test_05_failure\n          - tests/test_worker_020.py::test_06_timeout\n          - tests/test_worker_020.py::test_07_cancellation\n          - tests/test_worker_020.py::test_08_unexpected_crash\n          - tests/test_worker_020.py::test_09_cleanup\n          - tests/test_worker_020.py::test_10_resource_limits\n          - tests/test_worker_020.py::test_11_network_disabled\n          - tests/test_worker_020.py::test_12_filesystem_isolation\n          - tests/test_worker_020.py::test_13_capability_isolation\n          - tests/test_worker_020.py::test_14_worker_cannot_self_escalate\n          - tests/test_worker_020.py::test_15_worker_cannot_change_deadline\n          - tests/test_worker_020.py::test_16_worker_cannot_create_worker\n          - tests/test_worker_020.py::test_17_evidence\n          - tests/test_worker_020.py::test_18_telemetry\n          - tests/test_worker_020.py::test_19_reproducibility\n          - tests/test_worker_020.py::test_20_control_plane\n          - tests/test_worker_020.py::test_21_lifecycle_termination\n          - tests/test_worker_020.py::test_22_multiple_concurrent_workers\n          - tests/test_worker_020.py::test_23_unsupported_executor_fails_closed\n          - tests/test_worker_020.py::test_24_local_model_unavailable_fails_closed\n          - tests/test_registry_019.py::test_1_capability_registry\n          - tests/test_registry_019.py::test_2_capability_lookup\n          - tests/test_registry_019.py::test_3_unknown_capability\n          - tests/test_registry_019.py::test_4_disabled_capability\n          - tests/test_registry_019.py::test_5_deterministic_selection\n          - tests/test_registry_019.py::test_6_model_selection_abstraction\n          - tests/test_registry_019.py::test_7_authority_isolation\n          - tests/test_registry_019.py::test_9_executor_integration\n          - tests/test_registry_019.py::test_10_execution_record\n          - tests/test_registry_019.py::test_13_timeout\n          - tests/test_registry_019.py::test_14_output_limit\n          - tests/test_registry_019.py::test_15_security_boundaries\n          - tests/test_registry_019.py::test_16_control_plane\n          - tests/test_registry_019.py::test_17_multiple_executions\n          - tests/test_runtime_hardening_20260922.py::test_filesystem_boundary_rejects_sibling_prefix_and_missing_workspace\n          - tests/test_runtime_hardening_20260922.py::test_filesystem_boundary_rejects_symlink_escape\n          - tests/test_runtime_hardening_20260922.py::test_model_registry_rejects_placeholder_artifact_provenance\n          - tests/test_runtime_hardening_20260922.py::test_qwen_requires_non_placeholder_digest\n          - tests/test_runtime_hardening_20260922.py::test_remote_worker_fails_closed_without_injected_frontier_executor\n          - tests/test_runtime_hardening_20260922.py::test_update_manager_is_explicitly_quarantined\n          - tests/test_runtime_hardening_20260922.py::test_verified_sync_never_claims_stage_or_rollback_without_receipt\n          - tests/test_runtime_hardening_20260922.py::test_deterministic_executor_rejects_cross_workspace_path\n          - tests/test_runtime_hardening_20260922.py::test_local_model_invalid_result_cannot_be_promoted_to_success\n          - tests/test_runtime_hardening_20260922.py::test_legacy_execution_paths_are_quarantined\n          - tests/test_runtime_hardening_20260922.py::test_legacy_secret_broker_is_quarantined\n          - tests/test_runtime_hardening_20260922.py::test_release_identity_uses_canonical_runtime_version\n          - tests/test_runtime_hardening_20260922.py::test_bridge_requires_real_execution_context\n          - tests/test_runtime_hardening_20260922.py::test_bridge_rejects_stale_generation\n          - tests/test_runtime_hardening_20260922.py::test_bridge_capability_resolution_uses_canonical_registry\n          - tests/test_runtime_hardening_20260922.py::test_cli_has_no_identity_fallback_and_no_shell_string_uninstall\n          - tests/test_runtime_hardening_20260922.py::test_cli_server_default_uses_canonical_port\n          - tests/test_runtime_hardening_20260922.py::test_engine_health_is_not_unconditionally_green\n          - tests/test_runtime_hardening_20260922.py::test_admin_controls_report_blocked_or_not_implemented\n          - tests/test_runtime_hardening_20260922.py::test_runtime_server_links_canonical_execution_manager_to_engine\n          - tests/test_runtime_hardening_20260922.py::test_fabric_register_is_denied_when_canonical_capability_is_disabled\n          - tests/test_runtime_hardening_20260922.py::test_fabric_register_is_disabled_by_default\n          - tests/test_runtime_hardening_20260922.py::test_worker_propagates_registry_model_digest_to_qwen_executor\n          - tests/test_runtime_hardening_20260922.py::test_active_release_checksums_resolve_to_real_commits\n    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML cryptography psutil azure-identity httpx mcp websocket-client python-dateutil
      - name: Compile hardened runtime modules
        run: |
          python -m py_compile             runtime/execution/registry.py             runtime/execution/worker.py             runtime/execution/qwen_executor.py             runtime/execution/deterministic_executor.py             runtime/mcp/gateway.py             runtime/mcp/tools.py             runtime/api/bridge.py             runtime/core/engine.py             cli/main.py
      - name: Run focused hardening test file
        run: pytest -q "${{ matrix.test_file }}"
