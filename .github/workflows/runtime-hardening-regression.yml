name: runtime hardening regression

on:
  pull_request:
    paths:
      - "runtime/**"
      - "cli/**"
      - "scripts/**"
      - "tests/test_runtime_hardening_20260922.py"
      - "tests/test_worker_020.py"
      - "tests/test_workspace_execution_018.py"
      - "tests/test_deterministic_local_execution.py"
      - "tests/test_sync_service.py"
      - "tests/test_registry_019.py"
      - "tests/test_mcp_gateway_003.py"
      - ".github/workflows/runtime-hardening-regression.yml"

jobs:
  hardening:
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_runtime_hardening_20260922.py
          - tests/test_worker_020.py
          - tests/test_workspace_execution_018.py
          - tests/test_deterministic_local_execution.py
          - tests/test_sync_service.py
          - tests/test_registry_019.py
          - tests/test_mcp_gateway_003.py
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML cryptography psutil azure-identity httpx mcp websocket-client python-dateutil
      - name: Compile hardened runtime modules
        run: |
          python -m py_compile             runtime/execution/registry.py             runtime/execution/worker.py             runtime/execution/qwen_executor.py             runtime/execution/deterministic_executor.py             runtime/mcp/gateway.py             runtime/mcp/tools.py             runtime/api/bridge.py             runtime/core/engine.py             cli/main.py
      - name: Run focused hardening test file
        run: pytest -q "${{ matrix.test_file }}"
