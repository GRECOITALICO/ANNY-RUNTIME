name: AG-047 Governance Verification

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "tests/test_ag047_governance_and_audit_finalization.py"
      - "tests/test_worker_020.py"
      - "docs/MILESTONE-LEDGER-001.yaml"
      - "docs/evidence/END-TO-END-GOVERNANCE-AND-AUDIT-FINALIZATION-AG-047.json"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ag047-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AG-047 focused matrix
        run: |
          python -m pytest -q tests/test_ag047_governance_and_audit_finalization.py tests/test_worker_020.py

      - name: Record test environment
        if: always()
        run: |
          python --version
          python -m pytest --version
