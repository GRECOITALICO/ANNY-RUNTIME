name: Control Center projection regression

on:
  pull_request:
    paths:
      - "runtime/admin/projections.py"
      - "runtime/admin/routes.py"
      - "runtime/admin/templates_cc.py"
      - "tests/test_control_center_projections.py"
      - ".github/workflows/control-center-projection-regression.yml"
  workflow_dispatch:

jobs:
  control-center-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML cryptography psutil azure-identity httpx mcp websocket-client python-dateutil
      - name: Compile Control Center projection modules
        run: |
          python -m py_compile runtime/admin/projections.py runtime/admin/routes.py runtime/admin/templates_cc.py tests/test_control_center_projections.py
      - name: Run projection contract tests
        run: pytest -q tests/test_control_center_projections.py
