name: taxonomy regression

on:
  pull_request:
    paths:
      - 'runtime/intelligence/taxonomy.py'
      - 'tests/test_taxonomy_semantics.py'
      - '.github/workflows/taxonomy-regression.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'runtime/intelligence/taxonomy.py'
      - 'tests/test_taxonomy_semantics.py'
      - '.github/workflows/taxonomy-regression.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run taxonomy regression
        run: pytest -q tests/test_taxonomy_semantics.py
