name: runtime hardening diagnostic

on:
  push:
    branches:
      - codex/anny-runtime-hardening-20260922-001
  pull_request:
    paths:
      - "runtime/**"
      - "cli/**"
      - "scripts/**"
      - "tests/test_worker_020.py"
      - "tests/test_registry_019.py"
      - "tests/test_runtime_hardening_20260922.py"
      - ".github/workflows/runtime-hardening-diagnostic.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML cryptography psutil azure-identity httpx mcp websocket-client python-dateutil
      - name: Compile hardened runtime modules
        run: |
          python -m py_compile runtime/execution/registry.py runtime/execution/worker.py runtime/execution/qwen_executor.py runtime/execution/deterministic_executor.py runtime/mcp/gateway.py runtime/mcp/tools.py runtime/api/bridge.py runtime/core/engine.py cli/main.py
      - name: 1. tests/test_worker_020.py::test_01_create_worker
        id: t1
        continue-on-error: true
        run: |
          set +e
          pytest -q 'tests/test_worker_020.py::test_01_create_worker'
          rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/t1.result"
          exit $rc
      - name: 2. tests/test_worker_020.py::test_02_start_worker
