name: static purge audit

on:
  push:
    branches:
      - codex/anny-runtime-hardening-20260922-001

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static audit
        run: |
          python - <<'PY'
          import ast, pathlib, re, sys
          roots=[pathlib.Path("runtime"), pathlib.Path("cli"), pathlib.Path("scripts"), pathlib.Path("tests")]
          suspicious=[]
          noops=[]
          for root in roots:
              for p in root.rglob("*.py"):
                  text=p.read_text(encoding="utf-8", errors="replace")
                  for term in ["dummy_hash_for_now","test-tenant","chatgpt_luna","bridge_session","v0.2.0-CANDIDATE"]:
                      if term in text:
                          suspicious.append((str(p),"placeholder/synthetic",term))
                  for term in ["os.system(","RuntimeIdentity.generate(","gh auth token","/home/anny",".gemini/antigravity"]:
                      if term in text:
                          suspicious.append((str(p),"legacy/unsafe/special",term))
                  if root.name == "runtime" or str(p).startswith("cli/"):
                      if re.search(r'return\s*\{\s*["\']status["\']\s*:\s*["\']ok["\']',text):
                          suspicious.append((str(p),"hardcoded-success","status ok"))
                  try:
                      tree=ast.parse(text, filename=str(p))
                  except SyntaxError as e:
                      suspicious.append((str(p),"syntax-error",str(e)))
                      continue
                  for node in ast.walk(tree):
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                          body=[x for x in node.body if not isinstance(x,ast.Pass)]
                          if len(body)==0 and node.body:
                              noops.append((str(p),node.lineno,node.name))
          print("=== NOOP FUNCTIONS ===")
          for x in noops: print(x)
          print("=== SUSPICIOUS MATCHES ===")
          for x in suspicious: print(x)
          print(f"NOOP_COUNT={len(noops)}")
          print(f"SUSPICIOUS_COUNT={len(suspicious)}")
          # Fail only for confirmed production/runtime suspicious patterns;
          # test/manual validation references are reported, not blocked.
          prod_bad=[x for x in suspicious if x[0].startswith(("runtime/","cli/")) and x[2] not in ("gh auth token",)]
          if prod_bad:
              sys.exit(1)
          PY
