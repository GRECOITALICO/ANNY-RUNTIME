[project]
name = "anny-hosted-auth"
version = "0.1.0"
description = "Hosted ANNY GitHub App authorization service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "cryptography>=43,<46",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
