version: 1
purpose: durable milestone ledger for ANNY Runtime reconstruction
rules:
  - milestone completion requires implementation plus tests plus evidence
  - VERIFIED/CERTIFIED milestones are the only trusted resume points
  - historical test counts are not current test evidence
  - every new milestone must record commit_sha and next_action
  - every milestone that replaces or introduces an implementation path must perform a legacy-surface review before closeout
  - obsolete duplicate paths, stale compatibility branches, unsafe mock fallbacks, superseded routes, and stale tests must be removed in the same milestone when the replacement is verified and deletion is safe
  - if legacy deletion is not yet safe, the milestone must record the exact blocker and an explicit retirement gate; no undocumented fallback may remain
