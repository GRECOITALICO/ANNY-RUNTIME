next_p0:
  id: SYNC-IMPLEMENTATION-001
  objective: implement real governed SYNC end-to-end without implicit activation
  required_outputs:
    - canonical sync service/state machine
    - POST /api/sync
    - GET /api/sync/status
    - first-level Control Center SYNC UI
    - durable sync trace/evidence
    - negative/fail-closed tests
    - explicit separation of SYNC/STAGE/ACTIVATE
    - verified rollback path or explicit documented non-availability
resume_rule: read latest commit, rerun bootstrap, verify SYNC-CONTROL-001, then execute only SYNC-IMPLEMENTATION-001 after prerequisites are re-established
